<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="portalGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00FF95;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d97e;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0D394F;stop-opacity:0.6" />
    </radialGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#0D1B2A" stroke="#00FF95" stroke-width="2"/>
  
  <!-- Portal Effect -->
  <circle cx="50" cy="50" r="35" fill="url(#portalGradient)" opacity="0.9">
    <animate attributeName="r" values="35;38;35" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner Portal Ring -->
  <circle cx="50" cy="50" r="25" fill="none" stroke="#00FF95" stroke-width="2" opacity="0.7">
    <animate attributeName="r" values="25;28;25" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Center Portal -->
  <circle cx="50" cy="50" r="15" fill="#00FF95" opacity="0.5">
    <animate attributeName="r" values="15;18;15" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Letters R & M -->
  <text x="35" y="58" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0D1B2A">R</text>
  <text x="55" y="58" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0D1B2A">M</text>
</svg>
